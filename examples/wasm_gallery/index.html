<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Veil — hela galleriet som wasm</title>
<style>
  /* Nothing in this page lays anything out. Every box, every line of text
     and every rounded corner inside the canvas was decided by veil, in
     wasm, in this tab - there is no server and no DOM below it. */
  html, body { margin: 0; height: 100%; background: #0b0b0b; color: #8a8a8a;
               font: 12px "VeilBody", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; gap: 6px; padding: 10px; box-sizing: border-box; }
  /* The canvas takes whatever room is left. Veil lays out to that, every
     frame, so dragging the window is not a special case of anything. */
  canvas { border-radius: 8px; cursor: default; touch-action: none; flex: 1 1 auto; width: 100%; min-height: 0; display: block; }
  #status { min-height: 1.2em; }
  b { color: #e0b04a; font-weight: normal; }
</style>
</head>
<body>
<div id="status">laddar…</div>
<canvas id="cv"></canvas>
<script src="gl.js"></script>
<script>
// A canvas hands out ONE kind of context for its whole life, so the two
// painters get a canvas each, laid in the same place. The card draws unless
// ?gpu=0 says otherwise, and then the canvas2d reader takes over - which is
// also what happens by itself on a machine with no webgl2.
const onGpu = location.search.indexOf('gpu=0') < 0;
const flat = document.getElementById('cv');
const cv = onGpu ? flat.cloneNode(false) : flat;
if (onGpu) { cv.id = 'cv'; flat.id = 'flat'; flat.replaceWith(cv); }
const ctx = onGpu ? flat.getContext('2d') : cv.getContext('2d');
const statusEl = document.getElementById('status');

// The screen veil lays out for, in its own pixels - which is whatever room
// the window gives the canvas, not a number written down here.
//
// The canvas holds MORE dots than that on a display that packs more into
// the same inch: at 150 % a 1040-wide canvas stretched to 1560 is a blurred
// photograph of the UI. The backing store is sized in device dots and the
// whole painting scaled by the same factor, so text is drawn at the size it
// is shown at.
let W = 1040, H = 720, dots = 1;
function fit() {
  const r = cv.getBoundingClientRect();
  W = Math.max(320, Math.round(r.width));
  H = Math.max(240, Math.round(r.height));
  dots = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dots);
  cv.height = Math.round(H * dots);
  wearing = '';                       // a resized canvas forgets its state
  where = r;
  if (mod) mod.room_is(W, H);
}

const ICONS = {
  folder: '\u{1F4C1}', file: '\u{1F4C4}', search: '\u{1F50D}', settings: '⚙',
  bell: '\u{1F514}', user: '\u{1F464}', lock: '\u{1F512}', copy: '❐',
  trash: '\u{1F5D1}', menu: '≡', close: '✕', x: '✕',
  check: '✔', plus: '＋', minus: '−', play: '▶', pause: '⏸',
  star: '★', heart: '♥', diamond: '◆', circle: '●', triangle: '▲',
  chevron: '›', chevron_right: '›', chevron_left: '‹',
  chevron_down: 'ˇ', chevron_up: 'ˆ',
  arrow_right: '→', arrow_left: '←', arrow_up: '↑', arrow_down: '↓',
  sword: '\u{1F5E1}', shield: '\u{1F6E1}', bow: '\u{1F3F9}', potion: '\u{1F9EA}',
  ring: '\u{1F48D}', orb: '\u{1F52E}', scroll: '\u{1F4DC}', key: '\u{1F5DD}',
  pickaxe: '⛏', meat: '\u{1F356}', gem: '\u{1F48E}', coin: '\u{1FA99}',
};

// Clipping is a SETTING, not a stack. The resolver has already worked out
// what is inside every clip a node sits under, so each command says the
// finished box. A box with no area is how it says there is no clip.
let clipped = false;

// Pictures arrive as names. Loaded once, kept, and the frame asked for
// again when one lands - a missing picture is a hole, never a stall.
const pictures = new Map();
function pictureOf(name) {
  if (!name) return null;
  if (pictures.has(name)) return pictures.get(name) || null;
  const img = new Image();
  img.onload = () => { pictures.set(name, img); };
  img.onerror = () => pictures.set(name, null);
  // A name may carry folders - `assets/panel9.png` - so each piece is
  // encoded on its own; encoding the whole name turned the slash into %2F
  // and every picture 404'd.
  img.src = 'art/' + name.split('/').map(encodeURIComponent).join('/');
  pictures.set(name, null);
  return null;
}

// Assigning ctx.font re-parses the shorthand and re-resolves the face, and a
// screen has a hundred and fifty lines of text on it. Setting it only when it
// actually changes took a frame from six milliseconds to two.
let wearing = '';
function face(f) { if (f !== wearing) { ctx.font = f; wearing = f; } }

// The font shorthand for a size, built once per size rather than once per
// line of text.
const BODY = [], MARKS = [];
function bodyFont(size) { return BODY[size] || (BODY[size] = size + 'px VeilBody, system-ui, sans-serif'); }
function markFont(size) { return MARKS[size] || (MARKS[size] = size + 'px "Segoe UI Symbol", "Apple Symbols", "Segoe UI Emoji", "Apple Color Emoji", serif'); }


// --- the whole frame, as numbers ------------------------------------------
//
// The eleven painters above say a frame one command at a time, and every
// colour and every radius crosses as a STRING this side then has to read.
// This is the same frame as two blocks of numbers and one call.
//
//   cmds   twelve numbers a command, always in the same places
//   words  the letters, one byte to a number
//
// A colour arrives as `0xrrggbbaa` in one number. The table below turns it
// into the string canvas wants, once ever - twenty of those on a screen,
// against a hundred and fifty reads before.

const inks = new Map();
function inkOf(v) {
  let s = inks.get(v);
  if (s === undefined) {
    s = '#' + (v >>> 0).toString(16).padStart(8, '0');
    inks.set(v, s);
  }
  return s;
}

// A word out of the block: a length and then its bytes, one to a number.
const utf8Words = new TextDecoder();
let wordBytes = new Uint8Array(256);
function wordFrom(get, start) {
  const n = get(start);
  if (n > wordBytes.length) wordBytes = new Uint8Array(n * 2);
  for (let i = 0; i < n; i++) wordBytes[i] = get(start + 1 + i);
  return utf8Words.decode(wordBytes.subarray(0, n));
}

// Corners come as four numbers now, so nothing is parsed here.
function fourPath(x, y, w, h, tl, tr, br, bl) {
  if ((tl | tr | br | bl) === 0) { ctx.beginPath(); ctx.rect(x, y, w, h); return; }
  const cap = Math.min(w, h) / 2;
  if (tl === tr && tr === br && br === bl) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(tl, cap));
    return;
  }
  const a = Math.min(tl, cap), b = Math.min(tr, cap), c = Math.min(br, cap), d = Math.min(bl, cap);
  ctx.beginPath();
  ctx.moveTo(x + a, y);
  ctx.lineTo(x + w - b, y);
  ctx.arcTo(x + w, y, x + w, y + b, b);
  ctx.lineTo(x + w, y + h - c);
  ctx.arcTo(x + w, y + h, x + w - c, y + h, c);
  ctx.lineTo(x + d, y + h);
  ctx.arcTo(x, y + h, x, y + h - d, d);
  ctx.lineTo(x, y + a);
  ctx.arcTo(x, y, x + a, y, a);
  ctx.closePath();
}

function clipTo(x, y, w, h, rad) {
  if (clipped) { ctx.restore(); clipped = false; }
  if (w < 0 || h < 0) return;
  ctx.save();
  fourPath(x, y, w, h, rad, rad, rad, rad);
  ctx.clip();
  clipped = true;
}

// One frame. `cmds` and `words` are lists in linear memory: a length, then
// the numbers. Read as one Int32Array each and walked with no allocation.
function paintFrame(cmdsPtr, count, wordsPtr) {
  // A DataView, not an Int32Array: the allocator hands out one block where
  // the last one ended, so a block can start on any byte, and a typed array
  // insists on a multiple of four. getInt32 does not care.
  const d = bump();
  const cmdAt = cmdsPtr + 4, wordAt0 = wordsPtr + 4;
  const num = (i) => d.getInt32(cmdAt + i * 4, true);
  const wordNum = (i) => d.getInt32(wordAt0 + i * 4, true);
  drawn = count;
  for (let i = 0, at = 0; i < count; i++, at += 12) {
    const kind = num(at);
    const colour = num(at + 5);
    // -2 is "do not paint" and never needs a string; -1 is a gradient and
    // says so in letters.
    if (colour === -2 && kind !== 3 && kind < 8) continue;
    const x = num(at + 1), y = num(at + 2), w = num(at + 3), h = num(at + 4);

    if (kind === 1) {
      if (colour >= 0) ctx.fillStyle = inkOf(colour);
      else {
        const said = wordFrom(wordNum, num(at + 11));
        if (said.startsWith('grad:')) {
          const bits = said.split(':');
          const g = ctx.createLinearGradient(x, y, x, y + h);
          g.addColorStop(0, '#' + bits[1]); g.addColorStop(1, '#' + bits[2]);
          ctx.fillStyle = g;
        } else ctx.fillStyle = said;
      }
      fourPath(x, y, w, h, num(at + 6), num(at + 7), num(at + 8), num(at + 9));
      ctx.fill();
    } else if (kind === 2) {
      ctx.save();
      const col = colour >= 0 ? inkOf(colour) : wordFrom(wordNum, num(at + 11));
      ctx.shadowColor = col; ctx.shadowBlur = num(at + 7) || 0; ctx.fillStyle = col;
      fourPath(x, y, w, h, num(at + 6), num(at + 6), num(at + 6), num(at + 6));
      ctx.fill();
      ctx.restore();
    } else if (kind === 3) {
      clipTo(x, y, w, h, num(at + 6));
    } else if (kind === 4) {
      ctx.fillStyle = colour >= 0 ? inkOf(colour) : wordFrom(wordNum, num(at + 11));
      face(bodyFont(num(at + 6) || 13));
      ctx.fillText(wordFrom(wordNum, num(at + 10)), x, y);
    } else if (kind === 5) {
      const side = num(at + 6) || 16;
      ctx.fillStyle = colour >= 0 ? inkOf(colour) : wordFrom(wordNum, num(at + 11));
      face(markFont(side));
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ICONS[wordFrom(wordNum, num(at + 10))] || '·', x + side / 2, y + side / 2);
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    } else if (kind === 6) {
      const thick = num(at + 7) || 1;
      const r = (num(at + 6) || 0) - thick / 2;
      if (r <= 0) continue;
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, (num(at + 8) - 90) * Math.PI / 180, (num(at + 9) - 90) * Math.PI / 180);
      ctx.strokeStyle = colour >= 0 ? inkOf(colour) : wordFrom(wordNum, num(at + 11));
      ctx.lineWidth = thick; ctx.lineCap = 'butt';
      ctx.stroke();
      ctx.restore();
    } else if (kind === 7) {
      const pts = wordFrom(wordNum, num(at + 10)).trim().split(/\s+/);
      if (pts.length < 2) continue;
      ctx.fillStyle = colour >= 0 ? inkOf(colour) : wordFrom(wordNum, num(at + 11));
      ctx.beginPath();
      for (let k = 0; k < pts.length; k++) {
        const xy = pts[k].split(',');
        if (k === 0) ctx.moveTo(+xy[0], +xy[1]); else ctx.lineTo(+xy[0], +xy[1]);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      const img = pictureOf(wordFrom(wordNum, num(at + 10)));
      if (!img) continue;
      if (kind === 8) ctx.drawImage(img, x, y, w, h);
      else if (kind === 10) { const k = (num(at + 6) || 100) / 100; ctx.drawImage(img, x, y, img.width * k, img.height * k); }
      else {
        const s = num(at + 6) || 8, iw = img.width, ih = img.height;
        const cols = [[0, s], [s, iw - 2*s], [iw - s, s]];
        const rows = [[0, s], [s, ih - 2*s], [ih - s, s]];
        const dc = [[x, s], [x + s, w - 2*s], [x + w - s, s]];
        const dr = [[y, s], [y + s, h - 2*s], [y + h - s, s]];
        for (let r2 = 0; r2 < 3; r2++) for (let q = 0; q < 3; q++) {
          if (cols[q][1] <= 0 || rows[r2][1] <= 0 || dc[q][1] <= 0 || dr[r2][1] <= 0) continue;
          ctx.drawImage(img, cols[q][0], rows[r2][0], cols[q][1], rows[r2][1], dc[q][0], dr[r2][0], dc[q][1], dr[r2][1]);
        }
      }
    }
  }
  return count;
}


// --- the same frame, handed to the card -----------------------------------
// The number block goes almost straight into instances. What the reader
// above says with three hundred and fifty canvas calls, this says with one
// draw call: a rounded box, a ring and a letter are the same shape once a
// letter is a picture on a sheet.
//
// Behind ?gpu=1 while it is checked against the reader above, which is the
// one that has to keep working.
let GL = null;
const F = 1 / 255;

// --- what has not changed since the frame before --------------------------
//
// A screen where one meter moves says the same hundred and forty six things
// it said last time, and reading them again to arrive at the same instances
// was the biggest single thing a frame did. So the block is kept, and a
// command whose numbers AND words match the one at its place last time hands
// over the instances it made then. Twenty four numbers copied, against a
// walk through its letters.
//
// The two word offsets are left OUT of the number comparison and their
// CONTENT compared instead: a line that got a character longer moves every
// offset after it without changing a single thing on screen.
let wasCmds = new Int32Array(0), wasWords = new Int32Array(0);
let wasSpan = new Int32Array(0), wasFrom = new Int32Array(0), wasCount = -1;
let nowCmds = new Int32Array(0), nowWords = new Int32Array(0);
let nowSpan = new Int32Array(0), nowFrom = new Int32Array(0);
let kmdKept = 0;

function roomForBlock(count, words) {
  if (nowCmds.length < count * 12) {
    nowCmds = new Int32Array(count * 12); wasCmds = new Int32Array(count * 12);
    nowSpan = new Int32Array(count);      wasSpan = new Int32Array(count);
    nowFrom = new Int32Array(count);      wasFrom = new Int32Array(count);
    wasCount = -1;
  }
  if (nowWords.length < words) {
    nowWords = new Int32Array(words); wasWords = new Int32Array(words);
    wasCount = -1;
  }
}

// A word is a length and then its bytes. Two of them are the same word when
// they are the same length and the same bytes, wherever each of them lies.
function sameWord(a, b) {
  if (a < 0 || b < 0) return a === b;
  const n = nowWords[a];
  if (n !== wasWords[b]) return false;
  for (let i = 1; i <= n; i++) if (nowWords[a + i] !== wasWords[b + i]) return false;
  return true;
}

// `#rrggbb` or `#rrggbbaa`, with or without the hash, as four numbers.
function hexInk(t) {
  const hex = t.charCodeAt(0) === 35 ? t.slice(1) : t;
  const v = parseInt(hex.slice(0, 6), 16) || 0;
  return [((v >> 16) & 255) * F, ((v >> 8) & 255) * F, (v & 255) * F,
          hex.length >= 8 ? parseInt(hex.slice(6, 8), 16) * F : 1];
}

function glFrame(cmdsPtr, count, wordsPtr) {
  const g = GL || (GL = makeGl(cv));
  if (!g) return paintFrame(cmdsPtr, count, wordsPtr);
  const d = bump();
  const cmdAt = cmdsPtr + 4, wordAt0 = wordsPtr + 4;
  const wordRoom = d.getInt32(wordsPtr, true);
  drawn = count;

  // The whole block out of wasm memory in one pass, into plain arrays this
  // side. It is read many times over what follows, and a DataView call is
  // not free the way an element read is.
  roomForBlock(count, wordRoom);
  { const swapC = wasCmds; wasCmds = nowCmds; nowCmds = swapC;
    const swapW = wasWords; wasWords = nowWords; nowWords = swapW;
    const swapS = wasSpan; wasSpan = nowSpan; nowSpan = swapS;
    const swapF = wasFrom; wasFrom = nowFrom; nowFrom = swapF; }
  for (let i = 0, n = count * 12; i < n; i++) nowCmds[i] = d.getInt32(cmdAt + i * 4, true);
  for (let i = 0; i < wordRoom; i++) nowWords[i] = d.getInt32(wordAt0 + i * 4, true);

  const num = (i) => nowCmds[i];
  const wordNum = (i) => nowWords[i];
  // Places only line up when the two frames say the same NUMBER of things.
  const lineUp = count === wasCount;
  let clipDrifted = false;
  kmdKept = 0;

  g.begin(W, H);
  for (let i = 0, at = 0; i < count; i++, at += 12) {
    const kind = num(at);
    nowFrom[i] = g.at();
    nowSpan[i] = 0;
    // Ten numbers and two words. A clip makes no instances but sets what
    // every instance after it is cut to, so one that moved makes everything
    // after it new until a later clip puts the setting back.
    let held = lineUp;
    if (held) {
      for (let j = 0; j < 10; j++) if (nowCmds[at + j] !== wasCmds[at + j]) { held = false; break; }
      if (held) held = sameWord(num(at + 10), wasCmds[at + 10]) && sameWord(num(at + 11), wasCmds[at + 11]);
    }
    if (kind === 3) { if (!held) clipDrifted = true; }
    // Only the kinds that ARE instances can be handed over as instances. A
    // polygon draws itself on the side and leaves none behind, so handing
    // over its nothing drew nothing: the chart vanished the moment it
    // stopped changing. Pictures are the same, when they arrive.
    else if (held && !clipDrifted && kind >= 1 && kind <= 6) {
      const n = wasSpan[i];
      if (g.reuse(wasFrom[i], n) >= 0) { nowSpan[i] = n; kmdKept++; continue; }
    }
    const colour = num(at + 5);
    if (colour === -2 && kind !== 3 && kind < 8) continue;
    const x = num(at + 1), y = num(at + 2), w = num(at + 3), h = num(at + 4);
    // Four numbers out of one, the way the shader wants them. A gradient
    // still crosses as letters and shows its first stop until the shader
    // learns a second one.
    let r = 0, gr = 0, b = 0, a = 1, slide = null;
    if (colour >= 0) {
      r = ((colour >>> 24) & 255) * F; gr = ((colour >>> 16) & 255) * F;
      b = ((colour >>> 8) & 255) * F;  a = (colour & 255) * F;
    } else if (kind !== 3) {
      const said = wordFrom(wordNum, num(at + 11));
      const stops = said.startsWith('grad:') ? said.split(':') : null;
      const first = hexInk(stops ? stops[1] : said);
      r = first[0]; gr = first[1]; b = first[2]; a = first[3];
      if (stops) slide = hexInk(stops[2]);
    }

    if (kind === 1) {
      // A slide of colour is the same box with its far end riding along.
      if (slide) g.put(x, y, w, h, num(at + 6), num(at + 7), num(at + 8), num(at + 9),
                       r, gr, b, a, 3, 0, 0, slide[0], slide[1], slide[2], slide[3]);
      else g.put(x, y, w, h, num(at + 6), num(at + 7), num(at + 8), num(at + 9), r, gr, b, a, 0, 0, 0, 0, 0, 0, 0);
    } else if (kind === 2) {
      const rad = num(at + 6);
      g.put(x, y, w, h, rad, rad, rad, rad, r, gr, b, a, 0, num(at + 7) || 0, 0, 0, 0, 0, 0);
    } else if (kind === 3) {
      g.clip(w < 0 || h < 0 ? null : [x, y, w, h, num(at + 6)]);
    } else if (kind === 4 || kind === 5) {
      const size = num(at + 6) || 13;
      const mark = kind === 5;
      const face = g.faceOf(mark ? markFont(size) : bodyFont(size), mark);
      if (mark) {
        const word = ICONS[wordFrom(wordNum, num(at + 10))] || '·';
        // A mark hangs from the middle of its square, centred - the same
        // two anchors the sheet was written from.
        const gm = g.glyphOf(face, word);
        if (gm.w > 0) g.put(Math.round((x + size / 2) * dots) / dots + gm.dx, Math.round((y + size / 2) * dots) / dots + gm.dy, gm.w, gm.h, 0, 0, 0, 0,
                            r, gr, b, a, 1, 0, 0, gm.u0, gm.v0, gm.u1, gm.v1);
      } else {
        // The line says what line it is, and the word block says how long.
        // On a hit nothing is read: not the letters, not the sheet. Veil
        // measured this line by adding up advances, so the row was laid out
        // the same way, letter by letter, which is what was measured.
        const name = num(at + 7), off = num(at + 10);
        let row = face.rows.get(name);
        if (row === undefined || row.len !== wordNum(off)) {
          row = g.rowFor(face, wordFrom(wordNum, off), wordNum(off));
          face.rows.set(name, row);
        }
        for (let k = 0; k < row.n; k++) {
          const gm = row.gs[k];
          // A letter was drawn onto the sheet on whole pixels, so it is put
          // back on whole pixels. Landing it a third of a pixel over means
          // the card blends between texels and the letter goes soft; the
          // pen still walks in fractions, only the landing is snapped.
          g.put(Math.round((x + row.offs[k]) * dots) / dots + gm.dx, y + gm.dy, gm.w, gm.h, 0, 0, 0, 0,
                r, gr, b, a, 1, 0, 0, gm.u0, gm.v0, gm.u1, gm.v1);
        }
      }
    } else if (kind === 6) {
      const thick = num(at + 7) || 1, outer = num(at + 6) || 0;
      if (outer <= 0) continue;
      const side = outer * 2 + thick;
      g.put(x - side / 2, y - side / 2, side, side, outer - thick / 2, 0, 0, 0,
            r, gr, b, a, 2, 0, thick, num(at + 8) * Math.PI / 180, num(at + 9) * Math.PI / 180, 0, 0);
    } else if (kind === 7) {
      const said = wordFrom(wordNum, num(at + 10)).trim().split(/\s+/);
      const pts = [];
      for (const one of said) { const xy = one.split(','); if (xy.length === 2) pts.push(+xy[0], +xy[1]); }
      if (pts.length >= 6) g.polygon(pts, r, gr, b, a, W, H);
    } else if (kind >= 8) {
      // A picture is the same box with its own sheet. A tint of -2 is no
      // tint at all, which is white: the picture's own colours.
      const name = wordFrom(wordNum, num(at + 10));
      const spot = g.artFor(name, pictureOf(name));
      if (spot) {
        const S = g.artSize();
        const tr = colour === -2 ? 1 : r, tg = colour === -2 ? 1 : gr;
        const tb = colour === -2 ? 1 : b, ta = colour === -2 ? 1 : a;
        const quad = (dx, dy, dw, dh, sx, sy, sw, sh) => {
          if (dw <= 0 || dh <= 0 || sw <= 0 || sh <= 0) return;
          g.put(dx, dy, dw, dh, 0, 0, 0, 0, tr, tg, tb, ta, 4, 0, 0,
                (spot.x + sx) / S, (spot.y + sy) / S, (spot.x + sx + sw) / S, (spot.y + sy + sh) / S);
        };
        if (kind === 8) quad(x, y, w, h, 0, 0, spot.w, spot.h);
        else if (kind === 10) { const k = (num(at + 6) || 100) / 100; quad(x, y, spot.w * k, spot.h * k, 0, 0, spot.w, spot.h); }
        else {
          // Nine pieces: the corners keep their size, the edges stretch one
          // way and the middle stretches both.
          const c = num(at + 6) || 8;
          const sc = [[0, c], [c, spot.w - 2 * c], [spot.w - c, c]];
          const sr = [[0, c], [c, spot.h - 2 * c], [spot.h - c, c]];
          const dc = [[x, c], [x + c, w - 2 * c], [x + w - c, c]];
          const dr = [[y, c], [y + c, h - 2 * c], [y + h - c, c]];
          for (let q = 0; q < 3; q++) for (let e = 0; e < 3; e++)
            quad(dc[q][0], dr[e][0], dc[q][1], dr[e][1], sc[q][0], sr[e][0], sc[q][1], sr[e][1]);
        }
      }
    }
    nowSpan[i] = g.at() - nowFrom[i];
  }
  wasCount = count;
  g.flush(W, H);
  return count;
}

// --- the module -----------------------------------------------------------
// Everything wasm cannot do for itself. The slot store is a Map here and
// the clock is here, which is the whole of the "state" group - and it is
// what lets a framework whose caches, motion store and "how long has this
// been hovered" all live in slots run inside a tab.

let M = null, mod = null, floor = 0, deep = 0;
const began = performance.now();

// --- the slot store -------------------------------------------------------
// A byte-keyed table, and the reason it is not simply a Map of strings.
//
// A frame asks the store about two and a half thousand times. Measured, the
// call across the seam is FREE - what cost 0.25 microseconds a time was
// turning the key's bytes into a JS string so a Map could hash it. Eighty
// four per cent of the whole thing, for a string nobody ever reads.
//
// So the bytes are hashed where they lie and compared where they lie. A
// lookup allocates nothing. Text VALUES are kept as bytes too, so setting
// one and reading it back never makes a string either. 0.25 -> 0.04 µs.
const slots = (() => {
  let U = null, seen = null;
  const bytes = () => { if (seen !== M.buffer) { seen = M.buffer; U = new Uint8Array(M.buffer); } return U; };
  // hash -> entry, or an array of them when two keys land on one hash.
  const table = new Map();

  // The module hands over the key's HASH - it works it out in a dozen wasm
  // instructions over the bytes where they already lie - and leaves the
  // key's address at mem[8] for the one thing a hash cannot do: tell two
  // keys apart that landed on the same number.
  const keyAt = (u) => u[8] | (u[9] << 8) | (u[10] << 16) | (u[11] << 24);
  const same = (u, at, n, k) => {
    if (k.length !== n) return false;
    for (let i = 0; i < n; i++) if (k[i] !== u[at + i]) return false;
    return true;
  };
  const find = (h) => {
    const hit = table.get(h >>> 0);
    if (hit === undefined) return undefined;
    const u = bytes(), p = keyAt(u);
    const n = u[p] | (u[p+1] << 8) | (u[p+2] << 16) | (u[p+3] << 24);
    if (!Array.isArray(hit)) return same(u, p + 4, n, hit.k) ? hit : undefined;
    for (const e of hit) if (same(u, p + 4, n, e.k)) return e;
    return undefined;
  };
  const put = (h, v) => {
    const u = bytes(), p = keyAt(u);
    const n = u[p] | (u[p+1] << 8) | (u[p+2] << 16) | (u[p+3] << 24);
    h = h >>> 0;
    const hit = table.get(h);
    if (hit === undefined) { table.set(h, { k: u.slice(p + 4, p + 4 + n), v: v }); return; }
    if (!Array.isArray(hit)) {
      if (same(u, p + 4, n, hit.k)) { hit.v = v; return; }
      table.set(h, [hit, { k: u.slice(p + 4, p + 4 + n), v: v }]);
      return;
    }
    for (const e of hit) if (same(u, p + 4, n, e.k)) { e.v = v; return; }
    hit.push({ k: u.slice(p + 4, p + 4 + n), v: v });
  };
  // A text value, copied out of wasm memory as bytes. No string is made.
  const grab = (p) => {
    const u = bytes();
    const n = u[p] | (u[p+1] << 8) | (u[p+2] << 16) | (u[p+3] << 24);
    return u.slice(p + 4, p + 4 + n);
  };
  return {
    find: find, put: put, grab: grab,
    get size() { let n = 0; for (const v of table.values()) n += Array.isArray(v) ? v.length : 1; return n; },
    // For looking at the store from outside - a test, a status line. Never
    // on the path a frame takes.
    look: (name) => {
      for (const v of table.values())
        for (const e of (Array.isArray(v) ? v : [v]))
          if (utf8.decode(e.k) === name) return (e.v instanceof Uint8Array) ? utf8.decode(e.v) : e.v;
      return undefined;
    },
  };
})();

// One decoder, not one per string. A frame crosses this seam a couple of
// thousand times - every slot key, every colour, every line of text - and
// building a fresh TextDecoder each time was over half the frame.
const utf8 = new TextDecoder(), toUtf8 = new TextEncoder();
const readText = (p) => {
  const u = new Uint8Array(M.buffer);
  const n = u[p] | (u[p+1] << 8) | (u[p+2] << 16) | (u[p+3] << 24);
  return utf8.decode(u.subarray(p + 4, p + 4 + n));
};
// Text lives in linear memory behind a four-byte length, taken from the
// bump pointer the module keeps at address 0.
const EMPTY = new Uint8Array(0);
const allocBytes = (b) => {
  const dv = new DataView(M.buffer), u8 = new Uint8Array(M.buffer);
  const p = dv.getUint32(0, true);
  dv.setUint32(p, b.length, true);
  u8.set(b, p + 4);
  dv.setUint32(0, p + 4 + b.length, true);
  return p;
};
const allocText = (s) => allocBytes(toUtf8.encode(s));

const env = {
  __print: (p, nl) => console.log(readText(p)),
  __argc: () => 1,
  __argv: (i) => allocText(i === 0 ? 'veil' : ''),
  __file_write: () => 1,
  __file_read: () => allocText(''),
  host_sin: Math.sin, host_cos: Math.cos, host_tan: Math.tan,
  host_sqrt: Math.sqrt, host_exp: Math.exp, host_log: Math.log,
  host_pow: Math.pow, host_atan2: Math.atan2,
  __slot_set: (k, v) => { slots.put(k, v); return 0; },
  __slot_set_text: (k, v) => { slots.put(k, slots.grab(v)); return 0; },
  __slot_get_int: (k) => { const e = slots.find(k); return (e !== undefined && typeof e.v === 'number') ? e.v : 0; },
  // A slot carries a real too. Here the store keeps a JS number either way,
  // so the pair below is the same lookup with a double on the wire.
  __slot_set_real: (k, v) => { slots.put(k, v); return 0; },
  __slot_get_real: (k) => { const e = slots.find(k); return (e !== undefined && typeof e.v === 'number') ? e.v : 0; },
  __slot_get: (k) => { const e = slots.find(k); return allocBytes((e !== undefined && e.v instanceof Uint8Array) ? e.v : EMPTY); },
  __slot_has: (k) => (slots.find(k) !== undefined ? 1 : 0),
  __now: () => Math.round(performance.now() - began),
  fmt_float: (x, places) => allocText(Number(x).toFixed(places >>> 0)),
  // A page CAN have a kept region, and this is the whole of it. The bump
  // pointer lives at mem[0] and every allocation reads it, so switching
  // regions is switching what is in that one cell - no allocation code
  // anywhere knows or cares.
  //
  //   mem[0]  the pointer being allocated from
  //   mem[12] the frame pointer, parked while the kept region is in use
  //   mem[16] where the kept region has got to
  //
  // Counted, not toggled: font_body opens a kept scope inside one that is
  // already open, and a plain swap would park the KEPT pointer as if it
  // were the frame's and lose both. The native runtime counts the same way.
  orion_persist_on: () => { const d = bump(); if (deep++ === 0) { d.setUint32(12, d.getUint32(0, true), true); d.setUint32(0, d.getUint32(16, true), true); } return 0; },
  orion_persist_off: () => { const d = bump(); if (--deep === 0) { d.setUint32(16, d.getUint32(0, true), true); d.setUint32(0, d.getUint32(12, true), true); } return 0; },
  orion_arena_off: () => 0, orion_arena_on: () => 0, orion_arena_active: () => 0,

  // The whole frame in one call. `pack_page` on the other side puts it in
  // two blocks of numbers; nothing here reads a string it does not have to.
  page_frame: (cmdsPtr, count, wordsPtr) => (onGpu ? glFrame : paintFrame)(cmdsPtr, count, wordsPtr),
};

// --- one frame ------------------------------------------------------------
// Clear, call, wind the bump pointer back. That last line IS the frame
// region: everything a frame allocated is dead the moment it is painted,
// and what has to outlive it went to a slot.

const MOVE = 1, DOWN = 2, UP = 3, DRAG = 4, WHEEL = 5, CHAR = 6, KEY = 7;

// The bump pointer lives at address 0. One DataView, kept - but wasm memory
// GROWS, and growing hands out a new ArrayBuffer and detaches the old one.
// A view made once and held is dead the first time the module needs another
// page, and writing through it throws where the reset belongs, so the frame
// region silently stops being wound back and the module runs out of memory.
let mem0 = null, memBuf = null;
function bump() {
  if (memBuf !== M.buffer) { memBuf = M.buffer; mem0 = new DataView(M.buffer); }
  return mem0;
}

// --- two regions ----------------------------------------------------------
// Above the floor sit a KEPT region and a frame region. A told frame builds
// itself in the kept one, so the frame before it is still whole when it is
// read; the frame region is wound back after every frame and holds what a
// boot call or a resize made.
//
// The kept region only grows - a told frame reuses commands that point at
// words the frame BEFORE it allocated, and that reference never moves
// forward. When it is nearly full the page empties it and takes ONE cold
// frame, the one frame that needs no chain behind it.
// How long a run of told frames can be, in bytes.
//
// A told frame reuses commands that point at words the frame BEFORE it
// allocated, and those point further back again, so the whole run has to
// stay. The run ends when this fills: the page empties it and takes one
// cold frame, the one frame that needs nothing behind it.
//
// Measured: a told frame of the densest page leaves 380 kB here, so four
// megabytes is a run of ten and one frame in ten is cold.
//
// Twenty four megabytes was tried: it takes the cold frames from one in ten
// to one in sixty five, and did not measurably shorten the middle frame.
// A cold frame is 1.3 ms against 0.8 told, so one in ten costs half a
// tenth of a millisecond on average - too small to see against a machine
// that varies by twice that between one minute and the next. Four
// megabytes, then, because it is the smaller number and buys nothing less.
const KEPT = 4 << 20;
let keptBase = 0, prev = 0, cold = 0, told = 0;

function room() {
  const want = floor + KEPT + (8 << 20);
  if (want > M.buffer.byteLength) M.grow(Math.ceil((want - M.buffer.byteLength) / 65536));
}

function wipeKept() {
  bump().setUint32(16, keptBase, true);   // the kept region starts over
  prev = 0;                               // and the next frame is built cold
}

function tell(what, x, y, code, mods) {
  if (!mod) return;
  clipTo(0, 0, -1, -1, 0);
  ctx.setTransform(dots, 0, 0, dots, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = 'top';
  ctx.lineJoin = 'round';
  drawn = 0;
  const t0 = performance.now();
  try {
    if (!prev) { prev = mod.blank(); cold++; } else told++;
    prev = mod.told(prev, what | 0, x | 0, y | 0, code | 0, mods | 0);
  } catch (err) {
    deep = 0;                             // a frame that threw left a scope open
    wipeKept();
    throw err;
  } finally {
    // Everything this frame allocated is dead now. Winding the pointer back
    // IS the frame region - and it happens even if the frame threw, because
    // a frame that does not give its memory back takes the next one down
    // with it, and the one after that, until the module is out of memory.
    bump().setUint32(0, floor + KEPT, true);
  }
  if (bump().getUint32(16, true) - keptBase > KEPT - (256 << 10)) wipeKept();
  spent = performance.now() - t0;
  recent[at++ % recent.length] = spent;
  seenFrames++;
  clipTo(0, 0, -1, -1, 0);
}

// The canvas is 1040 wide whatever room the window gives it, so a pointer
// at a page pixel is not at a canvas pixel. The rect is kept: asking for it
// forces the browser to lay the page out, and a mouse asks a few hundred
// times a second.
let where = cv.getBoundingClientRect();
addEventListener('resize', fit);
addEventListener('scroll', () => { where = cv.getBoundingClientRect(); }, true);
new ResizeObserver(fit).observe(cv);
function spot(ev) {
  return [Math.round((ev.clientX - where.left) * W / where.width),
          Math.round((ev.clientY - where.top) * H / where.height)];
}

// --- one clock -------------------------------------------------------------
// A browser frame drives everything. Events go in a queue and are drained on
// the next frame; nothing paints outside it.
//
// This is what "not quite smooth" was. Motion ran off a 100 ms timer, so a
// scroll eased at ten frames a second while the display did sixty. A wheel
// painted the whole screen from inside its own handler, and a trackpad sends
// a hundred of those a second - each one a full rebuild the display never
// showed. And the status line was rewritten every frame, which is a DOM
// parse and a page layout for a number nobody reads that fast.

const waiting = [];
let drawn = 0, spent = 0, said = '', asleep = 0, awake = 0, said_at = 0;

// The last sixty frames, and the middle one of them.
//
// A single frame is not a measurement: the same screen, built the same way,
// takes between three and seven tenths of a millisecond depending on what
// else the machine is doing. Showing the last one made the number jump and
// made it look as though nothing ever got faster - it read 0.9 when the
// middle of six hundred frames was 0.4. So the bar says the middle one.
const recent = new Float64Array(60);
let at = 0, seenFrames = 0;
function middling() {
  const n = Math.min(seenFrames, recent.length);
  if (n === 0) return 0;
  const s = Array.prototype.slice.call(recent, 0, n).sort((a, b) => a - b);
  return s[n >> 1];
}

function later(what, x, y, code, mods) {
  const back = waiting[waiting.length - 1];
  // Moves collapse into each other - only the newest position matters. Wheel
  // steps add up, so a fast flick still travels its whole distance. A press,
  // a release and a key are each their own event and are never lost.
  if (back && back[0] === what && (what === MOVE || what === DRAG)) {
    back[1] = x; back[2] = y;
    return;
  }
  if (back && back[0] === WHEEL && what === WHEEL) { back[2] += y; return; }
  waiting.push([what, x, y, code | 0, mods | 0]);
}

function beat() {
  requestAnimationFrame(beat);
  if (!mod) return;
  if (waiting.length === 0) {
    // Nobody touched anything. If nothing on this screen is moving either,
    // it is the same picture it was a moment ago - and building it again to
    // find that out costs the whole frame. The canvas already holds it.
    //
    // This is the cheapest frame there is: the one nobody builds. A page
    // with a meter on it says so and gets built; a page without one is
    // still, and costs a single call to ask.
    if (!mod.restless()) { asleep++; return; }
    awake++;
    // The clock frame. Anything that eases keeps easing, at the rate the
    // display actually runs at.
    tell(0, 0, 0, 0, 0);
  } else {
    while (waiting.length) { const e = waiting.shift(); tell(e[0], e[1], e[2], e[3], e[4]); }
  }
  // Four times a second, not sixty. The number in it changes every frame,
  // so writing it every frame is a DOM parse and a page layout inside the
  // very frame it is reporting on - measuring the thing was part of what
  // the thing cost.
  if (performance.now() - said_at < 250) return;
  said_at = performance.now();
  const now = '<b>' + drawn + '</b> ritkommandon på <b>' + middling().toFixed(2) + ' ms</b> i mitten av de sista sextio — veil i wasm, ingen server'
    + (told ? ' · <b>' + Math.round(told * 100 / (told + cold)) + ' %</b> berättade ur den förra' : '')
    + (asleep ? ' · <b>' + Math.round(asleep * 100 / (asleep + awake)) + ' %</b> av ramarna behövde inte byggas' : '');
  if (now !== said) { said = now; statusEl.innerHTML = now; }
}

let down = false;
cv.addEventListener('pointermove', e => { const at = spot(e); later(down ? DRAG : MOVE, at[0], at[1], 0, 0); });
// Whether a finger or a mouse is doing this. It matters in exactly one
// place: a finger dragging empty space is scrolling, a mouse is not.
const finger = e => (e.pointerType === 'touch' || e.pointerType === 'pen') ? 1 : 0;
cv.addEventListener('pointerdown', e => {
  down = true;
  cv.setPointerCapture(e.pointerId);
  const at = spot(e); later(DOWN, at[0], at[1], 0, finger(e));
});
addEventListener('pointerup', e => {
  if (!down) return;
  down = false;
  const at = spot(e); later(UP, at[0], at[1], 0, 0);
});
// How far the wheel turned, in pixels, whatever unit it chose to say it in.
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const px = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaMode === 2 ? e.deltaY * H : e.deltaY;
  later(WHEEL, 0, Math.round(px), 0, 0);
}, { passive: false });
// A key belongs to whatever the screen says is being typed into. Codes for
// the ones that MOVE, a character for the rest - the split every editor makes.
const KEYS = { Backspace: 8, Delete: 46, ArrowLeft: 37, ArrowRight: 39, ArrowUp: 38, ArrowDown: 40, Home: 36, End: 35, Enter: 13, Tab: 9, Escape: 27 };
addEventListener('keydown', e => {
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) later(CHAR, 0, 0, e.key.codePointAt(0), 0);
  else if (KEYS[e.key] !== undefined) {
    e.preventDefault();
    later(KEY, 0, 0, KEYS[e.key], (e.shiftKey ? 1 : 0) + (e.ctrlKey ? 2 : 0));
  }
});

// The clipboard is the browser's, so it is asked and answered here. Text
// crosses as a pointer into linear memory, the same way it does everywhere
// else at this seam.
addEventListener('copy', e => {
  if (!mod) return;
  const s = readText(mod.picked_text());
  if (!s) return;
  e.clipboardData.setData('text/plain', s);
  e.preventDefault();
});
addEventListener('cut', e => {
  if (!mod) return;
  const s = readText(mod.picked_text());
  if (!s) return;
  e.clipboardData.setData('text/plain', s);
  e.preventDefault();
  mod.cut_out();
});
addEventListener('paste', e => {
  if (!mod) return;
  const s = e.clipboardData.getData('text/plain');
  if (!s) return;
  e.preventDefault();
  mod.paste_in(allocText(s));
});

// --- boot -----------------------------------------------------------------
// The face has to be in place before the first frame: a painter drawing in
// a face nobody measured paints a different program however right its
// rectangles are. It is the very TTF the resolver measured with.
(async () => {
  try {
    const face = new FontFace('VeilBody', await (await fetch('Inter-Regular.subset.ttf')).arrayBuffer());
    await face.load();
    document.fonts.add(face);
  } catch (err) {
    statusEl.textContent = 'ritar i en annan face an den som matte: ' + err.message;
  }
  const src = await WebAssembly.instantiateStreaming(fetch('gallery.wasm'), { env: env });
  mod = src.instance.exports;
  M = mod.memory;
  mod.boot();
  fit();                              // tell it how much room it has
  // Where the bump pointer stands once the program has started: everything
  // above this line is one frame's worth and is thrown away after each.
  floor = bump().getUint32(0, true);
  keptBase = floor;
  room();
  bump().setUint32(16, keptBase, true);          // the kept region starts here
  bump().setUint32(0, floor + KEPT, true);       // the frame region after it
  requestAnimationFrame(beat);
})();
</script>
</body>
