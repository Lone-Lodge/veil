# The gates, on a machine that is not the author's laptop.
#
# veil is written in Orion, so the job builds Orion first, from its committed
# seed. gates.sh then runs the check suite, builds the wasm gallery, and
# validates that every import the module asks for is one the page supplies.

name: green

# Manual for the author: a push does not need a runner to repeat what the gates
# already said on the machine that made the change. A PULL REQUEST is the other
# case entirely - it is code nobody here has run yet, so it is proven before it
# is read.
on:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          path: veil

      - uses: actions/checkout@v5
        with:
          repository: Lone-Lodge/orion
          path: orion

      # clang on a Windows runner drives the MSVC linker, which shells out to
      # mt.exe for the manifest. The Windows SDK is installed but its bin dir
      # is not on PATH, and the link dies with LNK1158 - nothing to do with
      # the code. Put the newest SDK bin on PATH before anything builds.
      - name: windows sdk on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $dir = Get-ChildItem $root -Directory |
                 Where-Object { Test-Path (Join-Path $_.FullName "x64\mt.exe") } |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $dir) { throw "no Windows SDK with mt.exe under $root" }
          $bin = Join-Path $dir.FullName "x64"
          Write-Host "adding $bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: bootstrap orion
        run: cd orion && bash tools/bootstrap.sh

      # The page is generated from the README; a drifted page is a lie.
      - name: guide matches the readme
        run: cd veil && python tools/guide.py --check

      # The toolchain builds dist/orbit.exe on every platform, and gates.sh
      # calls it `orbit`. Git Bash on Windows finds the .exe by itself; a
      # Linux shell does not, and the gate died on "command not found".
      - name: orbit under the name the scripts use
        if: runner.os != 'Windows'
        run: ln -sf orbit.exe orion/dist/orbit

      - name: gates
        run: cd veil && PATH="$PWD/../orion/dist:$PATH" bash tools/gates.sh
