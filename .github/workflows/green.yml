# The gates, on a machine that is not the author's laptop.
#
# veil is written in Orion, so the job builds Orion first, from its committed
# seed. gates.sh then runs the check suite, builds the wasm gallery, and
# validates that every import the module asks for is one the page supplies.

name: green

# Manual for the author: a push does not need a runner to repeat what the gates
# already said on the machine that made the change. A PULL REQUEST is the other
# case entirely - it is code nobody here has run yet, so it is proven before it
# is read.
on:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          path: veil

      - uses: actions/checkout@v5
        with:
          repository: Lone-Lodge/orion
          path: orion

      - name: bootstrap orion
        run: cd orion && bash tools/bootstrap.sh

      # The page is generated from the README; a drifted page is a lie.
      - name: guide matches the readme
        run: cd veil && python tools/guide.py --check

      - name: gates
        run: cd veil && PATH="$PWD/../orion/dist:$PATH" bash tools/gates.sh
