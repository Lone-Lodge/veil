# Publish docs/ so the guide opens in a browser.
#
# A .html file linked from a README on GitHub shows its source, not the page.
# Pages serves the same folder as a site, so the link in the README points at
# something a reader can actually read. Nothing is generated here: docs/ is
# committed, and `python tools/guide.py --check` proves it is not stale.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions.

name: pages

# No path filter: a force-push has no diff GitHub can filter on, so the guide
# silently never deployed. The job is a copy and an upload, it costs nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
